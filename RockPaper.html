<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>title</title>
</head>

<script>
    function getComputerChoice() {

        let Maximum = 3
        let rock = "rock"
        let paper = "paper"
        let scissor = "scissor"
        let Random_Choice = Math.floor(Math.random() * Maximum);


        if (Random_Choice == 0) {
            return rock
        }
       else if (Random_Choice == 1) {
            return paper
        }
       else if (Random_Choice == 2) {
            return scissor
        }
    }

    function getHumanChoice() {
        let prompt1;
        prompt1 = prompt("Rock, Paper, Scissor");
        return prompt1;
    }



    let humanscore = 0
    let computerscore = 0
    let maxscore = 5








    function playRound(HumanChoice, computerChoice) {
        let computerwon = "Computer Won!"
        let humanwon = "You Won!"
        let noone = "No one Won!"
        var game_result = noone;
        HumanChoice = HumanChoice.toLowerCase();

        if (HumanChoice == "rock") {
            if (computerChoice == "paper") {
                game_result = computerwon;
                computerscore++;
            } else if (computerChoice == "scissor") {
                game_result = humanwon;
                humanscore++;
            };
        } else if (HumanChoice == "scissor") {
            if (computerChoice == "rock") {
                game_result = computerwon;
                computerscore++;
            } else if (computerChoice == "paper") {
                game_result = humanwon;
                humanscore++;
            }
        } else if (HumanChoice == "paper") {
            if (computerChoice == "scissor") {
                game_result = computerwon;
                computerscore++;
            } else if (computerChoice == "rock") {
                game_result = humanwon;
                humanscore++;
            }

        }
        // console.log(computerscore)
        // console.log(humanscore)


        let humanlabel = document.getElementById("humanscore")
        humanlabel.textContent = humanscore

        let computerlabel = document.getElementById("computerscore")
        computerlabel.textContent = computerscore



        let resultlabel = document.getElementById("result")
        resultlabel.textContent = game_result;

        if (humanscore == maxscore) {
            alert(humanwon);
        }
        else if (computerscore == maxscore){
            alert(computerwon)
        }
    }

</script>

<div id="container">

    <label>Your score: </label> <label id="humanscore">0</label>
    <br>
    <label>Computer score: </label> <label id="computerscore">0</label>

<br >
    <button onclick="playRound('rock', getComputerChoice())">Rock</button>

    <button onclick="playRound('paper', getComputerChoice())">Paper</button>

    <button onclick="playRound('scissor', getComputerChoice())">Scissor</button>
<br>
    <label>This round: </label> <label id="result"></label>
</div>

</body>

</html>
